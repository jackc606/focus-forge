[project]
name = "hoi4-focus-forge"
version = "0.1.0"
description = "Native Windows focus tree editor for HOI4 / Millennium Dawn"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
